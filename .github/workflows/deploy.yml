name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-web-texora
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS (xoramateria.com)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            # SSH non-interactive tidak membaca .bashrc → nvm tidak termuat.
            # Tanpa ini, `npm`/`pm2` "command not found" sehingga deploy gagal.
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi
            cd ~/projects/texora-web
            git fetch origin main
            git reset --hard origin/main
            unset NODE_ENV
            npm ci --include=dev
            npx prisma migrate deploy
            rm -rf .next
            npm run build
            pm2 restart texora-web
            pm2 save
