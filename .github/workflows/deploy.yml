name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-web-texora
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS (xoramateria.com)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          debug: true
          script: |
            set -e
            # Simpan seluruh output deploy ke file di VPS supaya bisa dibaca
            # lewat `tail -n 120 ~/deploy-action.log` walau log GitHub sulit diakses.
            LOG="$HOME/deploy-action.log"
            : > "$LOG"
            exec >>"$LOG" 2>&1
            echo "=== deploy $(date -Is) ==="

            # SSH non-interactive tidak membaca .bashrc -> nvm tidak termuat.
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi

            echo "node: $(command -v node || echo MISSING) $(node -v 2>/dev/null)"
            echo "npm : $(command -v npm || echo MISSING) $(npm -v 2>/dev/null)"
            echo "pm2 : $(command -v pm2 || echo MISSING) $(pm2 -v 2>/dev/null)"

            cd ~/projects/texora-web
            git fetch origin main
            git reset --hard origin/main
            unset NODE_ENV
            npm ci --include=dev
            npx prisma migrate deploy
            rm -rf .next
            npm run build
            pm2 restart texora-web
            pm2 save
            echo "=== deploy selesai $(date -Is) ==="
